name: unifor-devsecops

x-dojo-env: &dojo-env
  DD_DATABASE_URL: postgresql://defectdojo:${DD_DATABASE_PASSWORD:?Execute python3 scripts/init_env.py}@postgres:5432/defectdojo
  DD_SECRET_KEY: ${DD_SECRET_KEY:?Execute python3 scripts/init_env.py}
  DD_CREDENTIAL_AES_256_KEY: ${DD_CREDENTIAL_AES_256_KEY:?Execute python3 scripts/init_env.py}
  DD_CELERY_BROKER_URL: redis://valkey:6379/0
  DD_CACHE_URL: redis://valkey:6379/1
  DD_ALLOWED_HOSTS: localhost,127.0.0.1,uwsgi
  DD_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
  DD_DEBUG: 'False'

x-dojo-app: &dojo-app
  image: defectdojo/defectdojo-django:3.3.100
  environment: *dojo-env
  depends_on:
    initializer:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy
  volumes:
    - dojo-media:/app/media

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: ${DD_DATABASE_PASSWORD:?Execute python3 scripts/init_env.py}
    volumes:
      - dojo-db:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U defectdojo -d defectdojo']
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 30

  initializer:
    image: defectdojo/defectdojo-django:3.3.100
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '--', '/entrypoint-initializer.sh']
    environment:
      <<: *dojo-env
      DD_INITIALIZE: 'true'
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@localhost
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: UNIFOR
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?Execute python3 scripts/init_env.py}
    depends_on:
      postgres:
        condition: service_healthy

  uwsgi:
    <<: *dojo-app
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '60', '--', '/entrypoint-uwsgi.sh']

  celeryworker:
    <<: *dojo-app
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '60', '--', '/entrypoint-celery-worker.sh']

  celerybeat:
    <<: *dojo-app
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '60', '--', '/entrypoint-celery-beat.sh']

  dojo:
    image: defectdojo/defectdojo-nginx:3.3.100
    environment:
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: '3031'
      NGINX_METRICS_ENABLED: 'false'
    depends_on:
      uwsgi:
        condition: service_started
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - dojo-media:/usr/share/nginx/html/media:ro

  dtrack-apiserver:
    image: dependencytrack/apiserver:4.14.4
    environment:
      ALPINE_CORS_ENABLED: 'true'
      ALPINE_CORS_ALLOW_ORIGIN: http://localhost:8082
      EXTRA_JAVA_OPTIONS: '-Xmx2g'
    mem_limit: 3g
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - dtrack-data:/data

  dtrack-frontend:
    image: dependencytrack/frontend:4.14.4
    environment:
      API_BASE_URL: http://localhost:8081
    ports:
      - '127.0.0.1:8082:8080'
    depends_on:
      - dtrack-apiserver

volumes:
  dojo-db:
  dojo-media:
  dtrack-data:
